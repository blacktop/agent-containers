# =============================================================================
# agent.pf.conf - macOS pf Firewall Rules for AI Agents
# =============================================================================
# IP-level allowlist matching the Docker firewall configuration.
# Use with sandbox-exec for defense-in-depth network isolation.
#
# Installation:
#   sudo ./install-anchor.sh
#
# Usage:
#   sudo pfctl -a com.apple/agent -D agent_uid="$(id -u "$USER")" -f agent.pf.conf
#   sandbox-exec -f agent.sb ... # sandbox does its own filtering
#
# Note: sandbox-exec already restricts network to port 443/80/53.
# This pf config adds IP-level filtering on top of that.
# =============================================================================

# --- Tables for IP ranges ---
# Dynamically populated by install-anchor.sh

table <github_ips> persist
table <allowed_ips> persist

# install-anchor.sh loads this anchor with: -D agent_uid=<uid>

# --- Default block rule ---
# Block all outbound from agent processes (matched by user or label)
# Note: In practice, we use anchor matching to apply these rules selectively

# --- Allow loopback ---
pass out quick on lo0 all user $agent_uid keep state

# --- DNS (allow to any) ---
pass out quick proto udp to any port 53 user $agent_uid keep state
pass out quick proto tcp to any port 53 user $agent_uid keep state

# --- GitHub IPs ---
pass out quick proto tcp to <github_ips> port { 22, 80, 443, 9418 } user $agent_uid keep state

# --- Allowed Service IPs ---
pass out quick proto tcp to <allowed_ips> port { 80, 443 } user $agent_uid keep state

# --- Private networks (always allowed) ---
pass out quick proto { tcp, udp } to 127.0.0.0/8 user $agent_uid keep state
pass out quick proto { tcp, udp } to 10.0.0.0/8 user $agent_uid keep state
pass out quick proto { tcp, udp } to 172.16.0.0/12 user $agent_uid keep state
pass out quick proto { tcp, udp } to 192.168.0.0/16 user $agent_uid keep state

# --- Block everything else ---
block out log quick proto { tcp, udp } user $agent_uid
