name: "PR - Test Updated Templates"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.templates.outputs.changes }}
      firewall_changed: ${{ steps.features.outputs.firewall }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: templates
        with:
          filters: |
            rust: src/rust/**
            python: src/python/**
            go: src/go/**
            typescript: src/typescript/**
      - uses: dorny/paths-filter@v3
        id: features
        with:
          filters: |
            firewall: src/features/firewall/**

  test-templates:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.templates != '[]' && needs.detect-changes.outputs.templates != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        templates: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Generating tests for '${{ matrix.templates }}'
        run: echo "${{ matrix.templates }}"

      - name: Configure template
        run: |
          set -e
          cd src/${{ matrix.templates }}

          # Configure templates only if `devcontainer-template.json` contains the `options` property.
          optionProp=( $(jq -r '.options' devcontainer-template.json) )

          if [ "${optionProp}" != "" ] && [ "${optionProp}" != "null" ] ; then  
            options=( $(jq -r '.options | keys[]' devcontainer-template.json) )

            if [ "${options[0]}" != "" ] && [ "${options[0]}" != "null" ] ; then
              echo "(!) Configuring template options within 'src/${{ matrix.templates }}' folder"
              for option in "${options[@]}"
              do
                option_key="\${templateOption:$option}"
                option_value=$(jq -r ".options | .${option} | .default" devcontainer-template.json)

                if [ "${option_value}" = "" ] || [ "${option_value}" = "null" ] ; then
                  echo "Template '${{ matrix.templates }}' is missing a default value for option '${option}'"
                  exit 1
                fi

                echo "(!) Replacing '${option_key}' with '${option_value}'"
                option_value_escaped=$(sed -e 's/[]\/$*.^[]/\\&/g' <<<"${option_value}")
                find ./ -type f -print0 | xargs -0 sed -i "s/${option_key}/${option_value_escaped}/g"
              done
            fi
          fi

          # Use local firewall feature during CI to avoid GHCR auth issues.
          feature_ref="ghcr.io/blacktop/agent-containers/firewall:1"
          echo "(!) Copying firewall feature into .devcontainer/features and repo-root .devcontainer/features"
          mkdir -p .devcontainer/features ../.devcontainer/features
          rm -rf .devcontainer/features/firewall ../.devcontainer/features/firewall
          cp -R ../features/firewall .devcontainer/features/firewall
          cp -R ../features/firewall ../.devcontainer/features/firewall

          if [ -f ".devcontainer/devcontainer.json" ]; then
            feature_local="./features/firewall"
            sed -i "s|$feature_ref|$feature_local|g; s|\.\./\.\./features/firewall|$feature_local|g; s|\.\./features/firewall|$feature_local|g" .devcontainer/devcontainer.json
          fi

          if [ -f ".devcontainer.json" ]; then
            feature_local="./.devcontainer/features/firewall"
            sed -i "s|$feature_ref|$feature_local|g; s|\.\./\.\./features/firewall|$feature_local|g; s|\.\./features/firewall|$feature_local|g" .devcontainer.json
          fi

          echo "(!) Feature reference after replacement:"
          if [ -f ".devcontainer/devcontainer.json" ]; then
            grep -E -n "features|firewall" .devcontainer/devcontainer.json || true
          fi
          if [ -f ".devcontainer.json" ]; then
            grep -E -n "features|firewall" .devcontainer.json || true
          fi

      - name: Run Smoke Test
        run: |
          template_id="${{ matrix.templates }}"
          src_dir="test/${template_id}"

          if [ ! -d "$(pwd)/${src_dir}" ] ; then  
            echo "Template '${{ matrix.templates }}' is missing a test folder"
            exit 1
          fi

          dest_dir="src/${template_id}/test-project"
          mkdir -p ${dest_dir}
          shopt -s dotglob
          cp -Rp ${src_dir}/* ${dest_dir}

          # Ensure host-mounted paths exist for devcontainer.json bind mounts in CI.
          mkdir -p /home/runner/.claude /home/runner/.codex /home/runner/.gemini
          touch /home/runner/.claude.json

          echo "Building dev container"
          id_label="test-container=${template_id}"
          devcontainer up --id-label ${id_label} --workspace-folder "src/${template_id}/"

          echo "Running Smoke Test"
          devcontainer exec --workspace-folder "src/${template_id}/" --id-label ${id_label} /bin/sh -c 'set -e && if [ -f "test-project/test.sh" ]; then cd test-project && if [ "$(id -u)" = "0" ]; then chmod +x test.sh; else sudo chmod +x test.sh; fi && ./test.sh; else ls -a; fi'

          # Clean up
          containers=$(docker container ls -f "label=${id_label}" -q)
          if [ -n "${containers}" ]; then
            docker rm -f ${containers}
          fi

  test-features:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.firewall_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build firewall feature
        uses: devcontainers/action@v1
        with:
          generate-features-test-matrix: "true"
          base-path-to-features: "./src/features"

      - name: Test firewall feature
        run: |
          chmod +x test/firewall/test.sh
          echo "Feature build successful"
          # Run smoke test inside a container built with the feature
          docker build -t firewall-feature-test -f - . <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends bash sudo curl jq iptables ipset dnsutils iproute2 aggregate && rm -rf /var/lib/apt/lists/*
          COPY src/features/firewall /tmp/firewall
          RUN /bin/bash /tmp/firewall/install.sh
          EOF
          docker run --rm -v "${PWD}/test/firewall:/tmp/test/firewall" firewall-feature-test /bin/bash -lc "chmod +x /tmp/test/firewall/test.sh && /usr/local/bin/init-firewall.sh && /tmp/test/firewall/test.sh"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate devcontainer-template.json files
        run: |
          for template in rust python go typescript; do
            if [ -f "src/$template/devcontainer-template.json" ]; then
              echo "Validating $template template..."
              cat "src/$template/devcontainer-template.json" | jq . > /dev/null
              echo "  ✓ Valid JSON"
            fi
          done

      - name: Validate devcontainer-feature.json
        run: |
          if [ -f "src/features/firewall/devcontainer-feature.json" ]; then
            echo "Validating firewall feature..."
            cat "src/features/firewall/devcontainer-feature.json" | jq . > /dev/null
            echo "  ✓ Valid JSON"
          fi

      - name: Validate devcontainer.json files
        run: |
          for template in rust python go typescript; do
            if [ -f "src/$template/.devcontainer/devcontainer.json" ]; then
              echo "Validating $template devcontainer.json..."
              # Strip // comments and trailing commas before validating with jq.
              sed -E 's/^[[:space:]]*\\/\\/.*$//; s/\\/\\/.*$//; s/,([[:space:]]*[}\\]])/\\1/g' "src/$template/.devcontainer/devcontainer.json" | jq . > /dev/null
              echo "  ✓ Valid JSON"
            fi
          done
